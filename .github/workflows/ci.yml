# Generated By Claude Code - Subject To Mistakes
# Runs on every pull request and every push to main.
#   1. frontend  - lint, test, and production build
#   2. backend   - type-check, then integration tests against Postgres (same command as locally)
#   3. migrate   - main only, after 1 and 2 pass: applies new database
#                  migrations to the production database
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Adds a "Run workflow" button on the Actions tab, e.g. to retry migrations.
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Catches type errors and build failures before Vercel sees them.
      # The URL is a placeholder; it only needs to be set for the build to run.
      - run: npm run build
        env:
          VITE_API_URL: https://ci-placeholder.invalid

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Catches TypeScript errors. tsx and Vercel run the code without checking types.
      - run: npm ci && npm run typecheck
        working-directory: backend
      # Same command as `npm run test:backend`: builds the backend image and
      # runs the tests against the app_test database in Docker Compose.
      - run: docker compose run --rm --build backend-test
      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db

# Run database migrations on the production database.
# Runs on every push to main (normally a merged PR) or a manual run on main,
# and only after the frontend and backend jobs pass.
  migrate:
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Never cancel a run partway through migrating the production database.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      # Set under GitHub repo Settings -> Secrets and variables -> Actions.
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Skip if the production database is not configured yet
        if: env.DATABASE_URL == ''
        # backend/ doesn't exist until checkout, so run from the workspace root.
        working-directory: .
        run: echo "::notice::PRODUCTION_DATABASE_URL secret is not set; skipping migrations."
      - uses: actions/checkout@v5
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@v5
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        if: env.DATABASE_URL != ''
      # --no-reject-unauthorized: use SSL without verifying the certificate,
      # matching how src/config/database.ts connects in production.
      - run: npm run migrate -- --no-reject-unauthorized
        if: env.DATABASE_URL != ''
