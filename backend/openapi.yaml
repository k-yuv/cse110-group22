# Describes every route the backend serves. app.ts uses this file to validate
# every request before it reaches a controller, and every response before it
# is sent. A route that isn't listed here responds 404.
openapi: 3.0.3
info:
  title: cse110-group22 API
  version: 0.0.0

paths:
  /api/health:
    get:
      summary: Check that the API is running
      responses:
        '200':
          description: The API is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [ok]

  /api/notes:
    get:
      summary: List every note, oldest first
      responses:
        '200':
          description: All notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        default:
          $ref: '#/components/responses/Error'

    post:
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewNote'
      responses:
        '201':
          description: The created note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        default:
          $ref: '#/components/responses/Error'

  /api/chapters/{chapter}/questions/{number}:
    parameters:
      - $ref: '#/components/parameters/Chapter'
      - $ref: '#/components/parameters/QuestionNumber'
    get:
      summary: Get one question by chapter and question number
      responses:
        '200':
          description: The question and its 4 choices (without the correct choice)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        default:
          $ref: '#/components/responses/Error'

  /api/chapters/{chapter}/questions/{number}/answers:
    parameters:
      - $ref: '#/components/parameters/Chapter'
      - $ref: '#/components/parameters/QuestionNumber'
    post:
      summary: Submit one of a question's 4 choices and find out if it's correct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAnswer'
      responses:
        '200':
          description: Whether the answer is correct
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResult'
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    Chapter:
      name: chapter
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    QuestionNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    NewAnswer:
      type: object
      required: [choice]
      additionalProperties: false
      properties:
        choice:
          description: Position (0-3) in the question's `choices` of the picked answer
          type: integer
          minimum: 0
          maximum: 3

    AnswerResult:
      type: object
      required: [correct]
      additionalProperties: false
      properties:
        correct:
          type: boolean

    Question:
      type: object
      required: [chapter, number, content, choices]
      additionalProperties: false
      properties:
        chapter:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 1
        content:
          type: string
          maxLength: 500
        choices:
          description: The 4 answer choices, referred to by position (0-3)
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 200

    Note:
      type: object
      required: [id, title, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        created_at:
          type: string
          format: date-time

    NewNote:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          # Must contain at least one non-whitespace character.
          pattern: '\S'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Error:
      description: Something went wrong; `error` says what
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
